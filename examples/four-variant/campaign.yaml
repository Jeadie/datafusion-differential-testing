name: four-variant-smoke

dataset:
  paths:
    - fixtures/data.sql

campaign:
  max_queries: 100
  query_timeout: 30s

artifacts:
  directory: artifacts

providers:
  duck_shared:
    type: duckdb
    params:
      duckdb_open: .datafusion-differential-test/duck-shared.db
  duck_orders:
    type: duckdb
    params:
      duckdb_open: .datafusion-differential-test/duck-orders.db
  duck_customers:
    type: duckdb
    params:
      duckdb_open: .datafusion-differential-test/duck-customers.db
  sqlite:
    type: sqlite
    params:
      sqlite_open: .datafusion-differential-test/sqlite.db

variants:
  just_memory:
    oracle: true
    tables:
      "*": memtable
  duckdb_shared_federated:
    tables:
      "*":
        provider: duck_shared
    session:
      extensions:
        - type: federation
  duckdb_split_federated:
    tables:
      orders:
        provider: duck_orders
      customers:
        provider: duck_customers
    session:
      extensions:
        - type: federation
  sqlite_nonfederated:
    tables:
      "*":
        provider: sqlite

generators:
  - type: corpus
    paths:
      - queries/*.sql
